plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.booktogame'
    compileSdk 34
    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "com.example.booktogame"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
                targets "main"
            }
        }
        
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            crunchPngs false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    externalNativeBuild {
        cmake {
            path "../../../CMakeLists.txt"
        }
    }

    // Unified source of game assets - we copy and package all game config JSONs and assets
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

tasks.register('copyGameAssets', Copy) {
    from('../../../') {
        include 'book.json'
        include 'options.json'
        include 'settings.json'
        include 'ai_*.json'
        include 'nbook_*.txt'
    }
    from('../../../assets') {
        into('')
    }
    into('src/main/assets')
}

preBuild.dependsOn copyGameAssets

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
