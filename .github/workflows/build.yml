name: Multiplatform Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      fail-fast: false  # Не отменять сборку на других ОС, если одна упала
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # --- ШАГ 1: Установка библиотек под каждую ОС ---
    - name: Install Dependencies (Linux)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt update
        sudo apt install -y build-essential cmake pkg-config libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-net-dev libsdl2-mixer-dev libcurl4-openssl-dev wget

    - name: Install Dependencies (Windows via vcpkg)
      if: matrix.os == 'windows-2022'
      run: |
        vcpkg install sdl2:x64-windows sdl2-image:x64-windows sdl2-mixer:x64-windows sdl2-ttf:x64-windows sdl2-net:x64-windows curl:x64-windows

    - name: Install Dependencies (macOS via Homebrew)
      if: matrix.os == 'macos-14'
      run: |
        brew install sdl2 sdl2_image sdl2_mixer sdl2_ttf sdl2_net curl

    # --- ШАГ 2: Конфигурация через CMake ---
    - name: Configure CMake (Linux)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        mkdir -p cmake
        echo "find_package(PkgConfig REQUIRED)" > cmake/FindSDL2_image.cmake
        echo "pkg_check_modules(SDL2_IMAGE REQUIRED sdl2_image)" >> cmake/FindSDL2_image.cmake
        echo "add_library(SDL2_image::SDL2_image INTERFACE IMPORTED)" >> cmake/FindSDL2_image.cmake
        echo "target_include_directories(SDL2_image::SDL2_image INTERFACE \${SDL2_IMAGE_INCLUDE_DIRS})" >> cmake/FindSDL2_image.cmake
        echo "target_link_libraries(SDL2_image::SDL2_image INTERFACE \${SDL2_IMAGE_LIBRARIES})" >> cmake/FindSDL2_image.cmake
        
        cp cmake/FindSDL2_image.cmake cmake/FindSDL2_mixer.cmake && sed -i 's/image/mixer/g' cmake/FindSDL2_mixer.cmake && sed -i 's/IMAGE/MIXER/g' cmake/FindSDL2_mixer.cmake
        cp cmake/FindSDL2_image.cmake cmake/FindSDL2_net.cmake && sed -i 's/image/net/g' cmake/FindSDL2_net.cmake && sed -i 's/IMAGE/NET/g' cmake/FindSDL2_net.cmake
        cp cmake/FindSDL2_image.cmake cmake/FindSDL2_ttf.cmake && sed -i 's/image/ttf/g' cmake/FindSDL2_ttf.cmake && sed -i 's/IMAGE/TTF/g' cmake/FindSDL2_ttf.cmake

        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_MODULE_PATH="${{ github.workspace }}/cmake"

    - name: Configure CMake (macOS)
      if: matrix.os == 'macos-14'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

    - name: Configure CMake (Windows)
      if: matrix.os == 'windows-2022'
      # Добавляем -DCOMPILE_DEFINITIONS=NOMINMAX, чтобы отключить ломающие макросы в Windows.h
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DCMAKE_CXX_FLAGS="/DNOMINMAX"

    # --- ШАГ 3: Компиляция проекта ---
    - name: Build Project
      run: cmake --build build --config Release --parallel

    # --- ШАГ 4: Сохранение готовых файлов ---
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: game-${{ matrix.os }}
        path: |
          build/Release/*.exe
          build/BOOK_TO_GAME
          build/*.app
