name: Multiplatform Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      fail-fast: false  # Не отменять сборку на других ОС, если одна упала
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # --- ШАГ 1: Установка библиотек под каждую ОС ---
    - name: Install Dependencies (Linux)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt update
        # Добавляем pkg-config, который поможет CMake найти SDL2 модули на Linux
        sudo apt install -y build-essential cmake pkg-config libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-net-dev libcurl4-openssl-dev wget

    - name: Install Dependencies (Windows via vcpkg)
      if: matrix.os == 'windows-2022'
      run: |
        vcpkg install sdl2:x64-windows sdl2-image:x64-windows sdl2-mixer:x64-windows sdl2-ttf:x64-windows sdl2-net:x64-windows curl:x64-windows

    - name: Install Dependencies (macOS via Homebrew)
      if: matrix.os == 'macos-14'
      run: |
        brew install sdl2 sdl2_image sdl2_mixer sdl2_ttf sdl2_net curl

    # --- ШАГ 2: Конфигурация через CMake ---
    - name: Configure CMake (Non-Windows)
      if: matrix.os != 'windows-2022'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

    - name: Configure CMake (Windows)
      if: matrix.os == 'windows-2022'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

    # --- ШАГ 3: Компиляция проекта ---
    - name: Build Project
      run: cmake --build build --config Release --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)

    # --- ШАГ 4: Сохранение готовых файлов ---
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: game-${{ matrix.os }}
        path: |
          build/Release/*.exe
          build/BOOK_TO_GAME
          build/*.app
