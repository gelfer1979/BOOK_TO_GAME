  # 2. DESKTOP BUILDS (macOS - Universal arm64+x86_64)
  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install macOS Dependencies
        run: |
          brew install ninja

      # Configure the project using CMake and Ninja for both architectures
      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" 2>&1 | tee cmake_config.log

      # Build the unified static binary and copy assets
      - name: Compile and Link
        run: |
          cmake --build build --config Release 2>&1 | tee cmake_build.log

      # Bundle the compiled static binary, assets, and config files into a clean archive
      - name: Package Distributable
        run: |
          mkdir -p dist
          
          # 1. Copy the .app bundle structure if it exists, or create a clean one
          if [ -d "build/BOOK_TO_GAME.app" ]; then
            cp -r build/BOOK_TO_GAME.app dist/
          else
            mkdir -p dist/BOOK_TO_GAME.app/Contents/MacOS
            mkdir -p dist/BOOK_TO_GAME.app/Contents/Resources
          fi
          
          # Ensure Contents/Resources exists
          mkdir -p dist/BOOK_TO_GAME.app/Contents/Resources
          
          # Copy to Contents/Resources (which SDL_GetBasePath returns on macOS)
          cp -r build/assets dist/BOOK_TO_GAME.app/Contents/Resources/ 2>/dev/null || cp -r assets dist/BOOK_TO_GAME.app/Contents/Resources/ 2>/dev/null || true
          cp ai_*.json dist/BOOK_TO_GAME.app/Contents/Resources/ 2>/dev/null || true
          cp options.json dist/BOOK_TO_GAME.app/Contents/Resources/ 2>/dev/null || true
          cp settings.json dist/BOOK_TO_GAME.app/Contents/Resources/ 2>/dev/null || true
          
          # Ensure Contents/MacOS exists
          mkdir -p dist/BOOK_TO_GAME.app/Contents/MacOS
          
          # Copy to Contents/MacOS (for fallback or alternate execution modes)
          cp -r build/assets dist/BOOK_TO_GAME.app/Contents/MacOS/ 2>/dev/null || cp -r assets dist/BOOK_TO_GAME.app/Contents/MacOS/ 2>/dev/null || true
          cp ai_*.json dist/BOOK_TO_GAME.app/Contents/MacOS/ 2>/dev/null || true
          cp options.json dist/BOOK_TO_GAME.app/Contents/MacOS/ 2>/dev/null || true
          cp settings.json dist/BOOK_TO_GAME.app/Contents/MacOS/ 2>/dev/null || true
          
          # 2. Locate the compiled executable binary anywhere in the build tree and copy it in
          BINARY_SOURCE=$(find build -type f -name "BOOK_TO_GAME" 2>/dev/null | grep -v "dist/" | head -n 1)
          if [ -z "$BINARY_SOURCE" ]; then
            BINARY_SOURCE=$(find build -type f -name "NativeWebViewWrapper" 2>/dev/null | grep -v "dist/" | head -n 1)
          fi
          
          if [ -n "$BINARY_SOURCE" ]; then
            echo "Found compiled binary at: $BINARY_SOURCE"
            cp "$BINARY_SOURCE" dist/BOOK_TO_GAME.app/Contents/MacOS/BOOK_TO_GAME
            chmod +x dist/BOOK_TO_GAME.app/Contents/MacOS/BOOK_TO_GAME
          else
            echo "ERROR: Compiled executable binary not found in build directory!"
            find build -type f || true
            exit 1
          fi
          
          # Pack the .app bundle directly into the zip archive
          cd dist && zip -r ../book-to-game-macos-universal.zip BOOK_TO_GAME.app

      # Upload the finished static packages to GitHub Releases / Artifacts
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-to-game-macos-universal
          path: book-to-game-macos-universal.zip
          if-no-files-found: ignore

      # Proactively upload debug logs if compilation fails
      - name: Upload Debug Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-macos-universal
          path: |
            cmake_config.log
            cmake_build.log

      # Push desktop build logs to a dedicated branch if failed
      - name: Push Build Logs to Git
        if: failure()
        shell: bash
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git checkout -b build-logs-macos-universal-${{ github.run_id }}
          git add cmake_config.log cmake_build.log
          git commit -m "ci: save build logs for macOS Universal run ${{ github.run_id }}"
          git push origin build-logs-macos-universal-${{ github.run_id }} --force

