name: Build and Package Desktop Releases

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-package:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Linux-specific graphics, audio, and window management dependencies
      # to ensure the static SDL2 build from source has full native system support.
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libxrandr-dev \
            libxss-dev \
            libxxf86vm-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libpulse-dev

      - name: Install macOS Dependencies
        if: matrix.os == 'macos-latest'
        run: |
          brew install ninja

      # Setup compiler on Windows to ensure Developer Command Prompt environment
      - name: Setup MSVC on Windows
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # Configure the project using CMake and Ninja
      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # Build the unified static binary and copy assets
      - name: Compile and Link
        run: |
          cmake --build build --config Release

      # Bundle the compiled static binary and asset folder into a clean archive
      - name: Package Distributable
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp build/BOOK_TO_GAME.exe dist/
            cp -r build/assets dist/
            cd dist && zip -r ../book-to-game-windows.zip *
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp build/BOOK_TO_GAME dist/
            cp -r build/assets dist/
            cd dist && zip -r ../book-to-game-macos.zip *
          else
            cp build/BOOK_TO_GAME dist/
            cp -r build/assets dist/
            cd dist && tar -czf ../book-to-game-linux.tar.gz *
          fi

      # Upload the finished static packages to GitHub Releases / Artifacts
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-to-game-${{ matrix.os }}
          path: |
            book-to-game-windows.zip
            book-to-game-macos.zip
            book-to-game-linux.tar.gz
          if-no-files-found: ignore
