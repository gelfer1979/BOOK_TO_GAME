name: Multiplatform Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      matrix:
        # GitHub запустит три параллельных сервера для каждой ОС!
        os: [ubuntu-22.04, windows-2022, macos-14]
    
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # --- ШАГ 1: Установка библиотек под каждую ОС ---
    - name: Install Dependencies (Linux)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt update
        sudo apt install -y build-essential cmake libsdl2-dev libsdl2-image-dev libcurl4-openssl-dev

    - name: Install Dependencies (Windows via vcpkg)
      if: matrix.os == 'windows-2022'
      run: |
        # На Windows библиотеки проще всего ставить через менеджер пакетов vcpkg
        vcpkg install sdl2 sdl2-image curl

    - name: Install Dependencies (macOS via Homebrew)
      if: matrix.os == 'macos-14'
      run: |
        brew install sdl2 sdl2_image curl

    # --- ШАГ 2: Универсальная сборка через CMake ---
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build build --config Release

    # --- ШАГ 3: Сохранение готовых файлов ---
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: game-${{ matrix.os }}
        path: |
          build/Release/*.exe
          build/BOOK_TO_GAME
          build/*.app
