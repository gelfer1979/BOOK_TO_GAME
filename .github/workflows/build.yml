name: Multiplatform Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      fail-fast: false  # Не отменять сборку на других ОС, если одна упала
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # --- ШАГ 1: Установка библиотек под каждую ОС ---
    - name: Install Dependencies (Linux)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt update
        sudo apt install -y build-essential cmake pkg-config libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-net-dev libsdl2-mixer-dev libcurl4-openssl-dev wget git

    - name: Install Dependencies (Windows via vcpkg)
      if: matrix.os == 'windows-2022'
      run: |
        # Используем x64-windows-static, чтобы vcpkg собрал всё в один монолитный блок и линкер ничего не потерял
        vcpkg install sdl2:x64-windows-static sdl2-image:x64-windows-static sdl2-mixer:x64-windows-static sdl2-ttf:x64-windows-static sdl2-net:x64-windows-static curl:x64-windows-static

    - name: Install Dependencies (macOS via Homebrew)
      if: matrix.os == 'macos-14'
      run: |
        brew install sdl2 sdl2_image sdl2_mixer sdl2_ttf sdl2_net curl

    # --- ШАГ 2: Конфигурация через CMake ---
    - name: Configure CMake (Linux)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        git clone https://github.com cmake-modules
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_MODULE_PATH="${{ github.workspace }}/cmake-modules"

    - name: Configure CMake (macOS)
      if: matrix.os == 'macos-14'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

    - name: Configure CMake (Windows)
      if: matrix.os == 'windows-2022'
      # Переключаем триплет vcpkg на static
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows-static `
          -DCMAKE_CXX_FLAGS="/DNOMINMAX /EHsc"

    # --- ШАГ 3: Компиляция проекта ---
    - name: Build Project
      run: cmake --build build --config Release --parallel

    # --- ШАГ 4: Сохранение готовых файлов ---
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: game-${{ matrix.os }}
        path: |
          build/Release/*.exe
          build/BOOK_TO_GAME
          build/*.app
